<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9eee7"><title>URPAC Urban Engine · U0.3-dev</title></head><body>
<main id="viewport" aria-label="Interactive miniature city"></main>
<header><div class="brandmark">U</div><div><strong>URPAC <span>URBAN ENGINE</span></strong><small>A city of possibilities.</small></div><b class="version">U0.3-dev</b></header>
<section class="location"><span class="eyebrow">CITY SCENARIO</span><h1>Riverbend</h1><p>A miniature city, an open canvas.</p><div class="stats"><span id="building-count">— buildings</span><span>1.44 km²</span><span id="district-count">6 districts</span></div></section>
<nav aria-label="City view controls"><select id="activity" aria-label="Urban activity">
 <option value="off">Activity off</option>
 <option value="low">Low activity</option>
 <option value="normal" selected>Normal activity</option>
 <option value="high">High activity</option>
 </select>
 <select id="quality" aria-label="Graphics quality">
 <option value="0.75">Performance</option>
 <option value="1" selected>Balanced</option>
 <option value="1.5">High quality</option>
 </select>
 <button id="day-night" aria-pressed="false"
 title="Switch day or night">☾ <span>Night</span></button><button id="reset" title="Reset camera">↺ <span>Reset view</span></button><button id="top" aria-pressed="false">▦ <span>Top-down</span></button><button id="fullscreen">⛶ <span>Fullscreen</span></button></nav>
<aside id="selection" hidden aria-live="polite"></aside>
<footer><div><span class="status-dot"></span> PROCEDURAL CITY <span class="divider">/</span> <span id="seed">SEED 4201</span></div><p>Drag to orbit · Scroll to zoom · Right-drag to pan · Click a building to explore</p><span class="north">N ↑</span></footer>
<div id="error" role="alert" hidden></div><script type="module" src="/src/main.js"></script></body></html>
